# RabbitMQ for local DSRFQ development.
#
# Two things here are not defaults and both are needed:
#
# 1. loopback_users = none
#    The stock `guest` account may only connect from 127.0.0.1. Inside Docker,
#    traffic arriving through a published port has the bridge gateway as its
#    source address, not loopback, so guest would be refused with ACCESS_REFUSED
#    even though you are on the same machine. Fine for a dev box on published
#    localhost ports; do not carry this into anything reachable off-machine.
#
# 2. web_mqtt
#    CostingPartsGrid subscribes to ws://localhost:15675/ws for live progress,
#    while RPA\RFQ publishes over AMQP to the amq.topic exchange. RabbitMQ maps
#    MQTT topics onto amq.topic, which is what makes those two halves meet.

loopback_users = none

listeners.tcp.default = 5672
management.tcp.port   = 15672

mqtt.listeners.tcp.default = 1883
mqtt.allow_anonymous       = false
mqtt.vhost                 = /
mqtt.exchange              = amq.topic

web_mqtt.tcp.port = 15675
